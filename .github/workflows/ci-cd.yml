name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Run all 4 service test suites in parallel ─────────────────────
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [users, products, stock, suppliers]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2          # latest — fixes Node.js 20 warning

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0        # latest — fixes Node.js 20 warning
        with:
          node-version: 20
          # Only cache if package-lock.json exists — avoids "path not resolved" error
          # when lockfiles haven't been committed yet
          cache: ${{ hashFiles(format('services/{0}/package-lock.json', matrix.service)) != '' && 'npm' || '' }}

      - name: Install dependencies
        run: npm install                        # use install, not ci — works without lockfile

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars_long
          JWT_EMAIL_SECRET: test_email_secret_at_least_32_chars_long
          JWT_PASSWORD_RESET_SECRET: test_reset_secret_at_least_32_chars_long
          FRONTEND_URL: http://localhost:3000

  # ── Frontend: install and build ───────────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000/api/v1

  # ── Docker build check (main branch only) ─────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-services, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users
            context: ./services/users
          - service: products
            context: ./services/products
          - service: stock
            context: ./services/stock
          - service: suppliers
            context: ./services/suppliers
          - service: gateway
            context: ./services/gateway
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: stockflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
