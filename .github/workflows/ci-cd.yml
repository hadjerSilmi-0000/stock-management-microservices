name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Run all 4 service test suites in parallel ─────────────────────
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let all matrix jobs finish even if one fails
      matrix:
        service: [users, products, stock, suppliers]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          # JWT secrets needed for token generation in tests
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars_long
          JWT_EMAIL_SECRET: test_email_secret_at_least_32_chars_long
          JWT_PASSWORD_RESET_SECRET: test_reset_secret_at_least_32_chars_long
          FRONTEND_URL: http://localhost:3000

  # ── Frontend: install, lint, build ───────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CI=false prevents warnings from being treated as errors
          CI: false
          REACT_APP_API_URL: http://localhost:5000/api/v1

  # ── Docker build check (main branch only) ─────────────────────────
  # Proves images build successfully without pushing to a registry
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-services, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users
            context: ./services/users
          - service: products
            context: ./services/products
          - service: stock
            context: ./services/stock
          - service: suppliers
            context: ./services/suppliers
          - service: gateway
            context: ./services/gateway
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false   # build only, no push — add a registry later
          tags: stockflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max